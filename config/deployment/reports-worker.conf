[program:lgu-payroll-reports]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/lgu-payroll/current/artisan queue:work database --queue=reports,default --sleep=3 --tries=3 --timeout=60 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/lgu-payroll-reports.log
stopwaitsecs=90
