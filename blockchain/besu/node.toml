profile="ENTERPRISE"
genesis-file="/network/genesis.json"
data-path="/var/lib/besu"
node-private-key-file="/keys/key"
static-nodes-file="/network/static-nodes.json"
permissions-nodes-config-file-enabled=true
permissions-nodes-config-file="/network/permissions_config.toml"
discovery-enabled=false
min-gas-price=0
tx-pool-enable-balance-check=false
sync-mode="FULL"
sync-min-peers=1
data-storage-format="BONSAI"
rpc-http-enabled=true
rpc-http-host="0.0.0.0"
rpc-http-api=["ETH","NET","WEB3","QBFT"]
host-allowlist=["localhost","127.0.0.1","validator1","validator2","validator3","validator4","rpc"]
rpc-ws-enabled=false
graphql-http-enabled=false
metrics-enabled=false
